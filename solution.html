<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水溶液じっけんラボ</title>
<style>
  :root {
    --bg: #1a1d24;
    --panel: #252932;
    --ink: #e8eaed;
    --line: #3a3f4b;
    --accent: #5b9bd5;
    --accent-ink: #fff;
    --muted: #9aa3b2;
    --shelf: #2f343f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .back-btn {
    background: var(--shelf); border: 1px solid var(--line);
    border-radius: 10px; width: 40px; height: 40px;
    cursor: pointer; font-size: 1.2rem; color: var(--ink);
    transition: all 0.15s ease; flex-shrink: 0;
  }
  .back-btn:hover { background: var(--accent); color: #fff; }
  header h1 { font-size: 1.4rem; letter-spacing: 0.04em; flex: 1; }
  .sub { color: var(--muted); font-size: 0.75rem; }

  .beaker-section {
    flex-shrink: 0; background: #0e1013;
    border-bottom: 1px solid var(--line); padding: 16px 8px;
    display: flex; flex-direction: column; align-items: center;
  }

  .apparatus-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    width: 100%;
  }

  .control-section { flex: 1; overflow-y: auto; padding: 16px; }

  /* ===== ビーカー（反応元） ===== */
  .beaker-area { 
    position: relative; 
    width: 120px; 
    height: 280px; 
    flex-shrink: 0;
  }
  .beaker {
    position: absolute; 
    bottom: 30px; 
    left: 0;
    width: 120px; 
    height: 130px;
    border: 3px solid rgba(255,255,255,0.45);
    border-top: none; 
    border-radius: 0 0 16px 16px;
    overflow: hidden; 
    background: rgba(255,255,255,0.04);
    transition: all 0.3s ease;
  }
  .beaker.broken { 
    opacity: 0; 
    transform: scale(0.8); 
    animation: breakGlass 0.4s ease-out; 
  }
  @keyframes breakGlass {
    0% { opacity: 1; transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.1) rotate(2deg); }
    100% { opacity: 0; transform: scale(0.6) rotate(-5deg); }
  }
  
  .liquid {
    position: absolute; 
    bottom: 0; 
    left: 0; 
    right: 0;
    height: 0%; 
    background: rgba(220, 235, 245, 0.12);
    transition: background 0.5s ease, height 0.3s linear;
  }
  .liquid.filled { height: 58%; }
  .liquid.cloudy { background: rgba(245, 245, 245, 0.78) !important; }
  .liquid::before {
    content: ""; 
    position: absolute; 
    top: -5px; 
    left: 0; 
    right: 0;
    height: 8px; 
    border-radius: 50%; 
    background: rgba(255,255,255,0.25);
    animation: wave 2.5s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 100% { transform: translateX(0) scaleX(1); }
    50% { transform: translateX(2px) scaleX(1.05); }
  }
  
  .solids-display {
    position: absolute; 
    bottom: 6px; 
    left: 6px; 
    right: 6px;
    display: flex; 
    gap: 3px; 
    flex-wrap: wrap;
    align-content: flex-end; 
    justify-content: center; 
    z-index: 2;
  }
  .solid-item {
    width: 22px; 
    height: 22px;
    transition: opacity 1.5s ease, transform 1.5s ease;
  }
  .solid-item.dissolving { 
    opacity: 0; 
    transform: scale(0.3); 
  }

  .bubbles {
    position: absolute; 
    top: 12%; 
    left: 0; 
    width: 100%;
    height: 50%; 
    pointer-events: none; 
    z-index: 3;
  }
  .bubble {
    position: absolute; 
    width: 3px; 
    height: 3px; 
    border-radius: 50%;
    background: rgba(255,255,255,0.7); 
    animation: rise 2s ease-in infinite;
  }
  @keyframes rise {
    0% { opacity: 1; transform: translateY(0px); }
    100% { opacity: 0; transform: translateY(-75px); }
  }
  .bubble:nth-child(1) { left: 15%; animation-delay: 0s; }
  .bubble:nth-child(2) { left: 25%; animation-delay: 0.2s; }
  .bubble:nth-child(3) { left: 35%; animation-delay: 0.4s; }
  .bubble:nth-child(4) { left: 45%; animation-delay: 0.1s; }
  .bubble:nth-child(5) { left: 55%; animation-delay: 0.3s; }
  .bubble:nth-child(6) { left: 65%; animation-delay: 0.5s; }
  .bubble:nth-child(7) { left: 75%; animation-delay: 0.15s; }
  .bubble:nth-child(8) { left: 85%; animation-delay: 0.35s; }

  /* ===== 沸騰エフェクト ===== */
  .boil-bubbles {
    position: absolute;
    bottom: 0; left: 0; right: 0; top: 0;
    pointer-events: none;
    z-index: 3;
    display: none;
  }
  .liquid.boiling .boil-bubbles { display: block; }
  .boil-bubble {
    position: absolute;
    bottom: 2px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    animation: boilRise 0.9s ease-in infinite;
  }
  @keyframes boilRise {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-52px) scale(1.3); }
  }
  .boil-bubble:nth-child(1) { left: 12%; width: 5px; height: 5px; animation-delay: 0s; }
  .boil-bubble:nth-child(2) { left: 28%; width: 7px; height: 7px; animation-delay: 0.25s; }
  .boil-bubble:nth-child(3) { left: 44%; width: 5px; height: 5px; animation-delay: 0.5s; }
  .boil-bubble:nth-child(4) { left: 58%; width: 8px; height: 8px; animation-delay: 0.12s; }
  .boil-bubble:nth-child(5) { left: 72%; width: 6px; height: 6px; animation-delay: 0.4s; }
  .boil-bubble:nth-child(6) { left: 85%; width: 5px; height: 5px; animation-delay: 0.65s; }
  .boil-bubble:nth-child(7) { left: 36%; width: 6px; height: 6px; animation-delay: 0.75s; }
  .boil-bubble:nth-child(8) { left: 64%; width: 5px; height: 5px; animation-delay: 0.9s; }

  /* 湯気（ビーカーの上） */
  .steam-area {
    position: absolute;
    left: 0; right: 0;
    bottom: 160px;
    height: 50px;
    pointer-events: none;
    z-index: 3;
    display: none;
  }
  .steam-area.active { display: block; }
  .steam {
    position: absolute;
    bottom: 0;
    width: 8px; height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.28);
    filter: blur(4px);
    animation: steamUp 1.8s ease-out infinite;
  }
  @keyframes steamUp {
    0% { opacity: 0; transform: translateY(6px) scaleX(1); }
    30% { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-30px) translateX(4px) scaleX(1.6); }
  }
  .steam:nth-child(1) { left: 30%; animation-delay: 0s; }
  .steam:nth-child(2) { left: 48%; animation-delay: 0.6s; }
  .steam:nth-child(3) { left: 65%; animation-delay: 1.1s; }

  .explosion {
    position: absolute; 
    bottom: 50px; 
    left: 50%;
    transform: translateX(-50%); 
    width: 100px; 
    height: 100px;
    background: radial-gradient(circle, #ffff00 0%, #ff8800 40%, #ff0000 70%, transparent 100%);
    border-radius: 50%; 
    opacity: 0; 
    pointer-events: none; 
    z-index: 5;
  }
  .explosion.active { animation: explode 0.6s ease-out; }
  @keyframes explode {
    0% { opacity: 1; transform: translateX(-50%) scale(0.3); }
    100% { opacity: 0; transform: translateX(-50%) scale(1.8); }
  }

  .paper {
    position: absolute; 
    top: 4px; 
    left: 50%;
    transform: translateX(-50%);
    width: 20px; 
    height: 130px; 
    border-radius: 3px 3px 0 0;
    display: none; 
    z-index: 4;
    overflow: hidden;
  }
  .paper.show { display: block; }
  /* 上半分（空気中：元の色のまま） */
  .paper-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 55%;
  }
  /* 下半分（液体に浸かる：変色する） */
  .paper-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 45%;
    transition: background 0.8s ease;
  }
  /* 濡れた境界のにじみ */
  .paper-bottom::before {
    content: "";
    position: absolute;
    top: -4px; left: 0; right: 0;
    height: 8px;
    background: inherit;
    opacity: 0.5;
    filter: blur(2px);
  }

  /* ===== アルコールランプ ===== */
  .alcohol-lamp-area {
    position: absolute;
    bottom: -56px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .lamp-svg {
    width: 56px;
    height: 56px;
    transition: transform 0.15s ease;
  }
  .alcohol-lamp-area:hover .lamp-svg { transform: scale(1.05); }
  /* 炎（点火時に表示） */
  .lamp-flame-svg {
    opacity: 0;
    transform-origin: center bottom;
  }
  .lamp-flame-svg.active {
    opacity: 1;
    animation: lampFlicker 0.15s infinite alternate;
  }
  @keyframes lampFlicker {
    0% { transform: scaleY(1) scaleX(1); }
    100% { transform: scaleY(1.08) scaleX(0.96); }
  }
  .lamp-tag {
    font-size: 0.62rem;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
  }
  .alcohol-lamp-area.on .lamp-tag { color: #ff9500; font-weight: 700; }

  /* 加熱後の結晶 */
  .crystals-display {
    position: absolute;
    bottom: 8px;
    left: 4px;
    right: 4px;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-content: flex-end;
    justify-content: flex-start;
    z-index: 2;
    height: 50px;
  }
  .crystal {
    width: 24px;
    height: 24px;
    opacity: 0;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    animation: crystallize 0.8s ease-out forwards;
  }
  @keyframes crystallize {
    0% { opacity: 0; transform: translateY(20px) scale(0.3); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== 食塩の3D立方体結晶 ===== */
  .cube-wrap {
    width: 20px;
    height: 20px;
    perspective: 120px;
  }
  .cube {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    animation: spinCube 7s linear infinite;
  }
  @keyframes spinCube {
    0% { transform: rotateX(-20deg) rotateY(0deg); }
    100% { transform: rotateX(-20deg) rotateY(360deg); }
  }
  .cube .face {
    position: absolute;
    inset: 0;
    background: rgba(248, 248, 250, 0.92);
    border: 1px solid rgba(200, 205, 215, 0.9);
    box-shadow: inset 0 0 4px rgba(255,255,255,0.9);
  }
  .cube .face.front  { transform: translateZ(10px); }
  .cube .face.back   { transform: rotateY(180deg) translateZ(10px); background: rgba(225, 228, 235, 0.92); }
  .cube .face.right  { transform: rotateY(90deg) translateZ(10px); background: rgba(235, 238, 244, 0.92); }
  .cube .face.left   { transform: rotateY(-90deg) translateZ(10px); background: rgba(235, 238, 244, 0.92); }
  .cube .face.top    { transform: rotateX(90deg) translateZ(10px); background: rgba(255, 255, 255, 0.95); }
  .cube .face.bottom { transform: rotateX(-90deg) translateZ(10px); background: rgba(215, 218, 226, 0.92); }

  /* ===== ミョウバンの3D正八面体結晶 ===== */
  .octa-wrap {
    width: 24px;
    height: 24px;
    perspective: 130px;
  }
  .octa {
    position: relative;
    width: 24px;
    height: 24px;
    transform-style: preserve-3d;
    animation: spinCube 8s linear infinite;
  }
  .oface {
    position: absolute;
    left: 5px;
    width: 14px;
    height: 12px;
  }
  .oface.otop {
    top: 0;
    clip-path: polygon(50% 0, 0 100%, 100% 100%);
    transform-origin: 50% 100%;
  }
  .oface.obottom {
    top: 12px;
    clip-path: polygon(50% 100%, 0 0, 100% 0);
    transform-origin: 50% 0%;
  }

  /* ===== 硫酸銅の3D柱状結晶（青） ===== */
  .prism-wrap {
    width: 18px;
    height: 26px;
    perspective: 140px;
  }
  .prism {
    position: relative;
    width: 16px;
    height: 24px;
    margin: 1px;
    transform-style: preserve-3d;
    animation: spinCube 8s linear infinite;
  }
  .pface { position: absolute; }
  .pface.pf, .pface.pb, .pface.pl, .pface.pr {
    left: 0; top: 0; width: 16px; height: 24px;
  }
  .pface.pf { transform: translateZ(8px); background: rgba(62, 122, 216, 0.9); }
  .pface.pb { transform: rotateY(180deg) translateZ(8px); background: rgba(30, 72, 145, 0.9); }
  .pface.pr { transform: rotateY(90deg) translateZ(8px); background: rgba(45, 95, 185, 0.9); }
  .pface.pl { transform: rotateY(-90deg) translateZ(8px); background: rgba(45, 95, 185, 0.9); }
  .pface.pt {
    left: 0; top: 0; width: 16px; height: 16px;
    transform: rotateX(90deg) translateZ(8px);
    background: rgba(110, 160, 235, 0.95);
  }
  .pface.pbm {
    left: 0; bottom: 0; width: 16px; height: 16px;
    transform: rotateX(-90deg) translateZ(8px);
    background: rgba(25, 60, 125, 0.9);
  }

  .info { 
    margin-top: 10px; 
    text-align: center; 
    min-height: 80px;
  }
  .label { 
    font-weight: 700; 
    font-size: 0.9rem; 
    min-height: 1.6em; 
  }
  .ph { 
    margin-top: 2px; 
    font-size: 0.7rem; 
    color: var(--muted); 
    min-height: 1.4em; 
  }
  .recipe { 
    margin-top: 6px; 
    font-size: 0.7rem; 
    color: var(--muted); 
    min-height: 2em; 
  }
  .gas-produced { 
    margin-top: 3px; 
    font-size: 0.75rem; 
    color: #4ade80; 
    font-weight: 600; 
  }
  .reaction {
    margin-top: 6px; 
    font-size: 0.65rem; 
    color: var(--accent);
    min-height: 2em; 
    font-weight: 600;
    background: rgba(91, 155, 213, 0.12); 
    padding: 4px; 
    border-radius: 8px;
  }
  .smell { 
    margin-top: 3px; 
    font-size: 0.7rem; 
    color: #fbbf24; 
  }

  /* ===== ガラス管 ===== */
  .tube-connector {
    width: 30px;
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    margin-bottom: 60px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .tube-connector .flow {
    position: absolute; 
    top: 0; 
    left: -20px;
    width: 12px; 
    height: 4px; 
    border-radius: 2px;
    background: rgba(255,255,255,0.8);
    opacity: 0;
  }
  .tube-connector.active .flow {
    animation: flowGas 1s linear infinite;
  }
  @keyframes flowGas {
    0% { opacity: 0; left: -20px; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; left: 40px; }
  }

  /* ===== 試験管 ===== */
  .testtube-area {
    position: relative; 
    width: 60px; 
    height: 170px; 
    flex-shrink: 0;
    opacity: 0.35; 
    transition: opacity 0.4s ease;
  }
  .testtube-area.has-gas { opacity: 1; }
  .testtube {
    position: absolute; 
    bottom: 0; 
    left: 50%;
    transform: translateX(-50%);
    width: 36px; 
    height: 110px;
    border: 3px solid rgba(255,255,255,0.4);
    border-top: none;
    border-radius: 0 0 16px 16px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
  }
  .testtube-cap {
    position: absolute; 
    bottom: 110px; 
    left: 50%;
    transform: translateX(-50%);
    width: 40px; 
    height: 6px;
    border: 3px solid rgba(255,255,255,0.4);
    border-bottom: none;
    border-radius: 4px 4px 0 0;
  }
  .gas-fill {
    position: absolute; 
    bottom: 0; 
    left: 0; 
    right: 0;
    height: 0%;
    transition: height 0.5s ease, background 0.4s ease;
  }
  .gas-fill.filled { height: 85%; }
  .limewater-fill {
    position: absolute; 
    bottom: 0; 
    left: 0; 
    right: 0;
    height: 0%; 
    background: rgba(220, 235, 245, 0.15);
    transition: height 0.4s ease, background 0.5s ease;
  }
  .limewater-fill.show { height: 30%; }
  .limewater-fill.cloudy { background: rgba(245,245,245,0.85) !important; }

  .tube-flame {
    position: absolute; 
    bottom: 116px; 
    left: 50%;
    transform: translateX(-50%);
    width: 14px; 
    height: 20px;
    background: radial-gradient(ellipse at center bottom, #ffcc00 0%, #ff6b00 45%, #ff2200 70%, transparent 80%);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    opacity: 0; 
    pointer-events: none; 
    z-index: 4;
  }
  .tube-flame.burn { 
    opacity: 1; 
    animation: flameFlicker 0.12s infinite; 
  }
  .tube-flame.burn-big {
    opacity: 1; 
    width: 34px; 
    height: 56px;
    animation: flameFlickerBig 0.08s infinite;
  }
  @keyframes flameFlicker {
    0%, 100% { transform: translateX(-50%) scaleY(0.9) scaleX(0.95); }
    50% { transform: translateX(-50%) scaleY(1.15) scaleX(1.05); }
  }
  @keyframes flameFlickerBig {
    0%, 100% { transform: translateX(-50%) scaleY(0.92) scaleX(0.95); }
    50% { transform: translateX(-50%) scaleY(1.2) scaleX(1.08); }
  }
  .tube-extinguish {
    position: absolute; 
    bottom: 120px; 
    left: 50%;
    transform: translateX(-50%); 
    font-size: 0.65rem;
    color: #ccc; 
    opacity: 0; 
    pointer-events: none; 
    white-space: nowrap;
  }
  .tube-extinguish.show { 
    animation: fadeInOut 1.2s ease-in-out; 
  }
  @keyframes fadeInOut {
    0% { opacity: 0; } 
    20% { opacity: 1; } 
    80% { opacity: 1; } 
    100% { opacity: 0; }
  }
  .testtube-label {
    margin-top: 6px; 
    font-size: 0.6rem; 
    color: var(--muted); 
    text-align: center;
  }
  .testtube-label.ok { color: #4ade80; font-weight: 700; }
  .testtube-label.ng { color: #f87171; font-weight: 700; }
  .testtube-label.part { color: #fbbf24; font-weight: 700; }

  /* ===== 置換法による試験管の向き ===== */
  /* 上方置換・水上置換：口を下に（逆さま） */
  .testtube-area.flipped .testtube {
    border-radius: 16px 16px 4px 4px;
    border-top: 3px solid rgba(255,255,255,0.4);
    border-bottom: none;
  }
  .testtube-area.flipped .testtube-cap { display: none; }
  .testtube-area.flipped .gas-fill {
    bottom: auto;
    top: 0;
  }
  /* 水上置換：水そう */
  .water-basin {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 58px;
    height: 20px;
    background: rgba(80, 140, 200, 0.35);
    border: 2px solid rgba(150, 190, 230, 0.5);
    border-radius: 3px;
    display: none;
    z-index: 1;
  }
  .testtube-area.water-mode .water-basin { display: block; }

  /* ===== 失敗：気体がにげるエフェクト ===== */
  .escape-puff {
    position: absolute;
    left: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(220, 230, 240, 0.85);
    pointer-events: none;
    z-index: 6;
    opacity: 0;
  }
  .escape-puff.esc-up { animation: escUp 1.2s ease-out forwards; }
  .escape-puff.esc-down { animation: escDown 1.2s ease-in forwards; }
  .escape-puff.esc-dissolve { animation: escDissolve 1.1s ease-out forwards; }
  @keyframes escUp {
    0% { opacity: 0.9; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -48px) scale(1.5); }
  }
  @keyframes escDown {
    0% { opacity: 0.9; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), 44px) scale(1.5); }
  }
  @keyframes escDissolve {
    0% { opacity: 0.9; transform: translate(-50%, 0) scale(1); }
    60% { opacity: 0.6; transform: translate(calc(-50% + var(--dx, 0px)), -6px) scale(0.6); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -8px) scale(0.1); }
  }
  /* 失敗時に試験管がプルッとゆれる */
  @keyframes shakeTube {
    0%, 100% { transform: translateX(-50%); }
    25% { transform: translateX(-58%); }
    75% { transform: translateX(-42%); }
  }
  .testtube.shake { animation: shakeTube 0.35s ease; }

  .panel {
    background: var(--panel); 
    border: 1px solid var(--line);
    border-radius: 12px; 
    padding: 12px; 
    margin-bottom: 12px;
  }
  .panel h2 {
    font-size: 0.85rem; 
    color: var(--muted); 
    margin-bottom: 8px;
    letter-spacing: 0.05em; 
    font-weight: 700;
  }
  .grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 6px; 
  }
  .grid.single { grid-template-columns: 1fr; }
  .grid.three { grid-template-columns: 1fr 1fr 1fr; }
  
  button {
    font-family: inherit; 
    font-size: 0.82rem; 
    cursor: pointer;
    border: 1px solid var(--line); 
    background: var(--shelf);
    color: var(--ink); 
    border-radius: 8px; 
    padding: 7px 5px;
    transition: all 0.15s ease; 
    font-weight: 600;
  }
  button:hover { border-color: var(--accent); }
  button.active { 
    background: var(--accent); 
    color: var(--accent-ink); 
    border-color: var(--accent); 
  }
  button:disabled { 
    opacity: 0.4; 
    cursor: not-allowed; 
  }
  
  .checkbox-btn {
    display: flex; 
    align-items: center; 
    gap: 5px;
    justify-content: flex-start; 
    font-size: 0.8rem; 
    color: var(--ink);
  }
  .checkbox-btn input { 
    width: 13px; 
    height: 13px; 
    cursor: pointer; 
    flex-shrink: 0; 
  }

  .collect-btn {
    width: 100%; 
    background: #2563eb; 
    color: #fff;
    padding: 8px; 
    margin-top: 10px; 
    border-color: #1d4ed8; 
    font-size: 0.85rem;
  }
  .collect-btn:hover { background: #1d4ed8; }
  .collect-btn:disabled { background: #555; }

  .tube-actions {
    display: flex; 
    gap: 8px; 
    margin-top: 10px;
  }
  .tube-actions button {
    flex: 1; 
    font-size: 0.78rem; 
    padding: 8px 4px;
  }
  .match-btn { 
    background: #f59e0b; 
    color: #fff; 
    border-color: #d97706; 
  }
  .match-btn:hover { background: #d97706; }
  .limewater-btn { 
    background: #16a34a; 
    color: #fff; 
    border-color: #15803d; 
  }
  .limewater-btn:hover { background: #15803d; }

  .reset {
    width: 100%; 
    background: transparent; 
    border: 1px dashed var(--line);
    color: var(--muted); 
    padding: 6px; 
    margin-top: 10px; 
    font-size: 0.8rem;
  }
  .hint {
    margin-top: 10px; 
    font-size: 0.7rem; 
    color: var(--muted);
    background: var(--shelf); 
    border-radius: 8px; 
    padding: 6px 8px; 
    line-height: 1.4;
  }
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="history.back()">←</button>
  <div>
    <h1>水溶液じっけんラボ</h1>
    <p class="sub">液体・固体・気体を組み合わせて、水溶液を作ろう</p>
  </div>
</header>

<div class="beaker-section">
  <div class="apparatus-row">
    <!-- ビーカー -->
    <div class="beaker-area">
      <div class="beaker" id="beaker">
        <div class="liquid" id="liquid">
          <div class="solids-display" id="solidsDisplay"></div>
          <div class="crystals-display" id="crystalsDisplay"></div>
          <div class="bubbles" id="bubbles"></div>
          <div class="boil-bubbles">
            <div class="boil-bubble"></div><div class="boil-bubble"></div>
            <div class="boil-bubble"></div><div class="boil-bubble"></div>
            <div class="boil-bubble"></div><div class="boil-bubble"></div>
            <div class="boil-bubble"></div><div class="boil-bubble"></div>
          </div>
        </div>
      </div>
      <div class="steam-area" id="steamArea">
        <div class="steam"></div><div class="steam"></div><div class="steam"></div>
      </div>
      <div class="explosion" id="explosion"></div>
      <div class="paper" id="paper">
        <div class="paper-top" id="paperTop"></div>
        <div class="paper-bottom" id="paperBottom"></div>
      </div>
      <div class="alcohol-lamp-area" id="lampArea" onclick="toggleHeating()">
        <svg class="lamp-svg" viewBox="0 0 56 56">
          <!-- 炎 -->
          <g class="lamp-flame-svg" id="lampFlame">
            <ellipse cx="28" cy="13" rx="5" ry="10" fill="#ff8c00"/>
            <ellipse cx="28" cy="15" rx="3" ry="7" fill="#ffd54a"/>
            <ellipse cx="28" cy="17" rx="1.5" ry="4" fill="#fff3c0"/>
          </g>
          <!-- 芯（しん） -->
          <rect x="26" y="20" width="4" height="6" rx="1" fill="#5a4632"/>
          <!-- 口金（首の金具） -->
          <path d="M22 26 L34 26 L33 30 L23 30 Z" fill="#9aa3b2"/>
          <rect x="22" y="25" width="12" height="2" rx="1" fill="#b8c0cc"/>
          <!-- ガラス容器（本体） -->
          <path d="M18 32 Q18 30 23 30 L33 30 Q38 30 38 34 L40 46 Q40 50 36 50 L20 50 Q16 50 16 46 Z" 
                fill="rgba(150,200,230,0.25)" stroke="rgba(180,210,235,0.5)" stroke-width="1.5"/>
          <!-- アルコール液 -->
          <path d="M18 40 L38 40 L39.5 46 Q39.5 49 36 49 L20 49 Q16.5 49 16.5 46 Z" 
                fill="rgba(120,180,220,0.3)"/>
          <!-- ハイライト -->
          <ellipse cx="23" cy="38" rx="2" ry="6" fill="rgba(255,255,255,0.25)"/>
        </svg>
        <div class="lamp-tag" id="lampTag">アルコールランプ</div>
      </div>
    </div>

    <!-- ガラス管 -->
    <div class="tube-connector" id="tubeConnector">
      <div class="flow"></div>
    </div>

    <!-- 試験管 -->
    <div class="testtube-area" id="testtubeArea">
      <div class="testtube-cap"></div>
      <div class="water-basin"></div>
      <div class="testtube" id="testtube">
        <div class="gas-fill" id="gasFill"></div>
        <div class="limewater-fill" id="limewaterFill"></div>
      </div>
      <div class="tube-flame" id="tubeFlame"></div>
      <div class="explosion" id="tubeExplosion"></div>
      <div class="tube-extinguish" id="tubeExtinguish">シュー…</div>
      <div class="testtube-label" id="testtubeLabel">気体なし</div>
    </div>
  </div>

  <div class="info">
    <div class="label" id="label"></div>
    <div class="ph" id="phinfo"></div>
    <div class="recipe" id="recipe"></div>
    <div class="gas-produced" id="gasProd"></div>
    <div class="reaction" id="reaction"></div>
    <div class="smell" id="smell"></div>
  </div>
</div>

<div class="control-section">
  <div class="panel">
    <h2>① 液体をえらぶ</h2>
    <div class="grid single" id="liquids"></div>
  </div>
  <div class="panel">
    <h2>② 固体を追加（複数可）</h2>
    <div class="grid" id="solids"></div>
  </div>

  <div class="panel">
    <h2>③ 気体の集め方をえらぶ</h2>
    <div class="grid three" id="collectMethods">
      <button id="mUp" onclick="collectWithMethod('up')" disabled>上方置換法</button>
      <button id="mDown" onclick="collectWithMethod('down')" disabled>下方置換法</button>
      <button id="mWater" onclick="collectWithMethod('water')" disabled>水上置換法</button>
    </div>
    <p id="collectHint" style="font-size:0.68rem;color:var(--muted);margin:8px 0 0;">気体が発生したら、集め方をえらんでタップしてね。まちがった方法だと集められないよ。</p>
  </div>

  <div class="panel" id="tubeActionsPanel" style="display:none;">
    <h2>④ 試験管の気体を調べる</h2>
    <div class="tube-actions" id="tubeActions">
      <button class="match-btn" onclick="testCombustion()">マッチで火をつける</button>
      <button class="limewater-btn" onclick="testLimewater()">石灰水に通す</button>
    </div>
  </div>

  <div class="panel">
    <h2>⑤ 指示薬を入れる（ビーカーへ）</h2>
    <div class="grid" id="indicators"></div>
  </div>

  <button class="reset" id="reset">すべてリセット</button>
  <div class="hint" id="hint">まず液体をえらんでね。</div>
</div>

    "酸素": { formula: "O₂（気体）→ ものを燃やすのを助ける", bubbles: false, gas: "酸素（O₂）", gasKey: "酸素", smell: "", combustible: "oxygen" },

  };

  let currentLiquid = null;
  let selectedSolids = new Set();
  let selectedIndicator = null;
  let beakerBroken = false;
  let collectedGas = null;
  let isHeating = false;
  let heatTimer = null;
  let liquidHeight = 58;
  let burnedSolids = new Set(); // 焦げた砂糖など

  const liquidEl = document.getElementById('liquid');
  const solidsDisplayEl = document.getElementById('solidsDisplay');
  const crystalsDisplayEl = document.getElementById('crystalsDisplay');
  const bubblesEl = document.getElementById('bubbles');
  const paperEl = document.getElementById('paper');
  const paperTopEl = document.getElementById('paperTop');
  const paperBottomEl = document.getElementById('paperBottom');
  const labelEl = document.getElementById('label');
  const phEl = document.getElementById('phinfo');
  const recipeEl = document.getElementById('recipe');
  const gasProdEl = document.getElementById('gasProd');
  const reactionEl = document.getElementById('reaction');
  const smellEl = document.getElementById('smell');
  const hintEl = document.getElementById('hint');
  const beakerEl = document.getElementById('beaker');
  const explosionEl = document.getElementById('explosion');
  const methodBtns = [document.getElementById('mUp'), document.getElementById('mDown'), document.getElementById('mWater')];
  const tubeActionsPanel = document.getElementById('tubeActionsPanel');
  function setMethodsEnabled(on) {
    methodBtns.forEach(b => b.disabled = !on);
  }
  const tubeConnector = document.getElementById('tubeConnector');
  const testtubeArea = document.getElementById('testtubeArea');
  const gasFillEl = document.getElementById('gasFill');
  const limewaterFillEl = document.getElementById('limewaterFill');
  const tubeFlameEl = document.getElementById('tubeFlame');
  const tubeExtinguishEl = document.getElementById('tubeExtinguish');

  const lampArea = document.getElementById('lampArea');

  const lampTag = document.getElementById('lampTag');
  const steamArea = document.getElementById('steamArea');

  Object.keys(LIQUIDS).forEach(name => {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => selectLiquid(name, b);
    document.getElementById('liquids').appendChild(b);
  });
  Object.keys(SOLIDS).forEach(name => {
    const label = document.createElement('label');
    label.className = 'checkbox-btn';
    label.style.cursor = 'pointer';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.value = name;
    input.onchange = () => toggleSolid(name, input.checked);
    const span = document.createElement('span');
    span.textContent = name;
    label.appendChild(input);
    label.appendChild(span);
    document.getElementById('solids').appendChild(label);
  });
  Object.keys(INDICATORS).forEach(name => {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => selectIndicator(name, b);
    document.getElementById('indicators').appendChild(b);
  });

  function selectLiquid(name, btn) {
    currentLiquid = name;
    beakerBroken = false;
    stopHeating();
    document.querySelectorAll('#liquids button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedIndicator = null;
    document.querySelectorAll('#indicators button').forEach(b => b.classList.remove('active'));
    paperEl.classList.remove('show');
    beakerEl.classList.remove('broken');
    render();
  }
  
  function toggleSolid(name, checked) {
    if (checked) selectedSolids.add(name);
    else selectedSolids.delete(name);
    selectedIndicator = null;
    document.querySelectorAll('#indicators button').forEach(b => b.classList.remove('active'));
    paperEl.classList.remove('show');
    render();
  }

  function selectIndicator(name, btn) {
    if (!currentLiquid || beakerBroken) {
      hintEl.textContent = "先に液体をえらんでね。";
      return;
    }
    selectedIndicator = name;
    document.querySelectorAll('#indicators button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function findReaction() {
    if (currentLiquid && selectedSolids.size > 0) {
      for (let solid of selectedSolids) {
        const key = currentLiquid + "+" + solid;
        if (REACTIONS[key]) return REACTIONS[key];
      }
    }
    return null;
  }

  function isLimewater() {
    return currentLiquid === "水" && selectedSolids.has("水酸化カルシウム");
  }

  function updateSolidsDisplay() {
    solidsDisplayEl.innerHTML = '';
    selectedSolids.forEach(solid => {
      const data = SOLIDS[solid];
      const item = document.createElement('div');
      item.className = 'solid-item';
      item.innerHTML = SVG[data.svg];
      item.title = solid;
      solidsDisplayEl.appendChild(item);
      if (currentLiquid && data.soluble) {
        setTimeout(() => { item.classList.add('dissolving'); }, 600);
      }
    });
  }

  function updateBubbles(hasBubbles) {
    bubblesEl.innerHTML = '';
    if (hasBubbles) {
      for (let i = 0; i < 8; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubblesEl.appendChild(bubble);
      }
    }
  }

  function calculateProperty() {
    if (!currentLiquid) return "neutral";
    const reaction = findReaction();
    if (reaction && reaction.neutralize) return "neutral";
    let acidScore = 0, baseScore = 0;
    if (LIQUIDS[currentLiquid].property === "acid") acidScore += 2;
    selectedSolids.forEach(solid => {
      const prop = SOLIDS[solid].property;
      if (prop === "acid" || prop === "acid_react") acidScore += 1;
      if (prop === "base") baseScore += 1;
    });
    if (acidScore > baseScore) return "acid";
    if (baseScore > acidScore) return "base";
    return "neutral";
  }

  function getCurrentGasKey() {
    const reaction = findReaction();
    if (reaction && reaction.gasKey) return reaction.gasKey;
    return null;
  }

  // ===== 加熱機能 =====
  function toggleHeating() {
    if (!currentLiquid) {
      hintEl.textContent = "先に液体をえらんでね。";
      return;
    }
    if (isHeating) {
      stopHeating();
    } else {
      startHeating();
    }
  }

  function startHeating() {
    isHeating = true;
    lampArea.classList.add('on');
    lampFlame.classList.add('active');
    lampTag.textContent = "加熱中…";
    liquidEl.classList.add('boiling');
    steamArea.classList.add('active');
    liquidHeight = 58;
    heatTimer = setInterval(() => {
      liquidHeight -= 2;
      if (liquidHeight <= 0) {
        completeHeating();
      } else {
        liquidEl.style.height = liquidHeight + '%';
      }
    }, 150);
  }

  function stopHeating() {
    if (heatTimer) clearInterval(heatTimer);
    isHeating = false;
    lampArea.classList.remove('on');
    lampFlame.classList.remove('active');
    lampTag.textContent = "アルコールランプ";
    liquidEl.classList.remove('boiling');
    steamArea.classList.remove('active');
  }

  function completeHeating() {
    stopHeating();
    liquidEl.style.height = '0%';

    const messages = [];

    // 1) 中和反応などで生成した塩（residue）が結晶化
    const reaction = findReaction();
    if (reaction && reaction.residue) {
      createCrystals(reaction.residue.svg, 0);
      let msg = reaction.residue.name + " の結晶が出てきた！";
      if (reaction.residue.svg === "salt") msg += " 食塩の結晶は立方体（サイコロの形）です。";
      messages.push(msg);
    }

    // 2) 溶けていた固体の挙動
    const dissolved = [];
    selectedSolids.forEach(solid => {
      if (SOLIDS[solid].soluble && currentLiquid) dissolved.push(solid);
    });
    dissolved.forEach((solid, idx) => {
      const behavior = SOLIDS[solid].heatBehavior;
      if (behavior === "crystallize") {
        // 中和で消費された固体は結晶化させない（residue側で表現済み）
        if (!(reaction && reaction.neutralize)) {
          createCrystals(SOLIDS[solid].svg, idx + 1);
          let smsg = solid + " の結晶が出てきた！";
          if (SOLIDS[solid].svg === "salt") smsg += " 食塩の結晶は立方体（サイコロの形）です。";
          if (SOLIDS[solid].svg === "alum") smsg += " ミョウバンの結晶は正八面体です。";
          if (SOLIDS[solid].svg === "copper_sulfate") smsg += " 硫酸銅の結晶は青い柱のような形です。";
          messages.push(smsg);
        }
      } else if (behavior === "burn") {
        burnedSolids.add(solid);
        messages.push("砂糖が焦げました！（カラメル化）");
      }
    });

    if (messages.length > 0) {
      hintEl.textContent = "水が蒸発した。" + messages.join(" ");
    } else {
      hintEl.textContent = "水が蒸発した。あとには何も残らなかった。";
    }
  }

  function createCrystals(svgKey, delay) {
    const numCrystals = 6 + Math.floor(Math.random() * 4);
    for (let i = 0; i < numCrystals; i++) {
      const crystal = document.createElement('div');
      crystal.className = 'crystal';
      crystal.style.animationDelay = (delay * 0.2 + i * 0.15) + 's';

      if (svgKey === "salt") {
        // 食塩（NaCl）：立方体
        crystal.appendChild(build3DCube(i));
      } else if (svgKey === "alum") {
        // ミョウバン：正八面体
        crystal.appendChild(build3DOcta(i));
      } else if (svgKey === "copper_sulfate") {
        // 硫酸銅：青い柱状結晶
        crystal.appendChild(build3DPrism(i));
      } else {
        crystal.innerHTML = SVG[svgKey];
        const bgDiv = document.createElement('div');
        bgDiv.style.position = 'absolute';
        bgDiv.style.inset = '-2px';
        bgDiv.style.background = 'rgba(255,255,255,0.08)';
        bgDiv.style.borderRadius = '4px';
        bgDiv.style.zIndex = '-1';
        crystal.style.position = 'relative';
        crystal.appendChild(bgDiv);
      }

      crystalsDisplayEl.appendChild(crystal);
    }
  }

  function build3DCube(i) {
    const wrap = document.createElement('div');
    wrap.className = 'cube-wrap';
    const cube = document.createElement('div');
    cube.className = 'cube';
    cube.style.animationDelay = (-i * 1.1) + 's';
    cube.style.animationDuration = (6 + (i % 3)) + 's';
    ['front','back','right','left','top','bottom'].forEach(f => {
      const face = document.createElement('div');
      face.className = 'face ' + f;
      cube.appendChild(face);
    });
    wrap.appendChild(cube);
    return wrap;
  }

  function build3DOcta(i) {
    const wrap = document.createElement('div');
    wrap.className = 'octa-wrap';
    const octa = document.createElement('div');
    octa.className = 'octa';
    octa.style.animationDelay = (-i * 1.3) + 's';
    octa.style.animationDuration = (7 + (i % 3)) + 's';
    const topShades = ['rgba(250,252,255,0.95)','rgba(215,224,235,0.95)','rgba(232,238,246,0.95)','rgba(205,214,228,0.95)'];
    const botShades = ['rgba(226,232,242,0.95)','rgba(190,200,214,0.95)','rgba(208,216,228,0.95)','rgba(180,190,205,0.95)'];
    for (let k = 0; k < 4; k++) {
      const t = document.createElement('div');
      t.className = 'oface otop';
      t.style.transform = `rotateY(${k * 90}deg) translateZ(7px) rotateX(35deg)`;
      t.style.background = topShades[k];
      octa.appendChild(t);
      const b = document.createElement('div');
      b.className = 'oface obottom';
      b.style.transform = `rotateY(${k * 90}deg) translateZ(7px) rotateX(-35deg)`;
      b.style.background = botShades[k];
      octa.appendChild(b);
    }
    wrap.appendChild(octa);
    return wrap;
  }

  function build3DPrism(i) {
    const wrap = document.createElement('div');
    wrap.className = 'prism-wrap';
    const prism = document.createElement('div');
    prism.className = 'prism';
    prism.style.animationDelay = (-i * 1.2) + 's';
    prism.style.animationDuration = (7 + (i % 3)) + 's';
    ['pf','pb','pr','pl','pt','pbm'].forEach(f => {
      const face = document.createElement('div');

      prism.appendChild(face);

  // ===== 気体の集め方の判定 =====
  // 性質（空気とくらべた重さ・水へのとけやすさ）から結果を導く
  function evalCollection(gasKey, method) {
    const g = GASES[gasKey];
    if (method === 'water') {
      if (g.waterSol === 'high') {
        return { ok: 'no', dir: 'dissolve', why: gasKey + "は水にとけやすいので、水の中でとけてしまい集められません。" };
      }
      return { ok: 'yes', why: gasKey + "は水にとけにくいので、水上置換法でしっかり集められます。" };
    }
    if (method === 'up') {
      if (g.air === 'lighter') {
        if (g.waterSol === 'high') {
          return { ok: 'yes', why: gasKey + "は" + g.airText + "ので、上方置換法で集められます。" };
        }
        return { ok: 'part', why: gasKey + "は集まったけど、空気が混ざってしまう…。水にとけにくい気体は水上置換法がベスト！" };
      }
      return { ok: 'no', dir: 'down', why: gasKey + "は" + g.airText + "ので、口を下に向けると下からにげてしまいます。" };
    }
    if (method === 'down') {
      if (g.air === 'heavier') {
        if (g.waterSol === 'low') {
          return { ok: 'part', why: gasKey + "は集まったけど、空気が混ざってしまう…。水にとけにくい気体は水上置換法がベスト！" };
        }
        return { ok: 'yes', why: gasKey + "は" + g.airText + "ので、下方置換法で集められます。" };
      }
      return { ok: 'no', dir: 'up', why: gasKey + "は" + g.airText + "ので、上へにげてしまいます。" };
    }
  }

  const METHOD_NAMES = { up: "上方置換法", down: "下方置換法", water: "水上置換法" };

  function collectWithMethod(method) {
    const gasKey = getCurrentGasKey();
    if (!gasKey) return;

    // 試験管の向きをセット
    resetTestTube();
    testtubeArea.classList.add('has-gas');
    if (method === 'up' || method === 'water') testtubeArea.classList.add('flipped');
    if (method === 'water') testtubeArea.classList.add('water-mode');
    testtubeLabelEl.textContent = METHOD_NAMES[method] + "で集めています…";

    const result = evalCollection(gasKey, method);
    tubeConnector.classList.add('active');

    setTimeout(() => {
      tubeConnector.classList.remove('active');

      if (result.ok === 'yes') {
        collectedGas = gasKey;
        gasFillEl.classList.add('filled');
        gasFillEl.style.background = GASES[gasKey].color;
        testtubeLabelEl.textContent = gasKey + " を集めた！";
        testtubeLabelEl.className = 'testtube-label ok';
        tubeActionsPanel.style.display = 'block';
        tubeActions.style.display = 'flex';
        hintEl.textContent = "せいこう！" + result.why;
        // 集め終わったら試験管をとり出す（向きをもどす）
        setTimeout(() => {
          testtubeArea.classList.remove('flipped', 'water-mode');
        }, 1400);
      } else if (result.ok === 'part') {
        collectedGas = gasKey;
        gasFillEl.classList.add('filled');
        // 空気まじり：にごったグレー
        gasFillEl.style.background = "rgba(180, 185, 195, 0.22)";
        testtubeLabelEl.textContent = gasKey + "（空気まじり）";
        testtubeLabelEl.className = 'testtube-label part';
        tubeActionsPanel.style.display = 'block';
        tubeActions.style.display = 'flex';
        hintEl.textContent = result.why;
        setTimeout(() => {
          testtubeArea.classList.remove('flipped', 'water-mode');
        }, 1400);
      } else {
        // 失敗：気体がにげる
        collectedGas = null;
        testtubeEl.classList.add('shake');
        setTimeout(() => testtubeEl.classList.remove('shake'), 400);
        spawnEscapePuffs(result.dir, method);
        testtubeLabelEl.textContent = "集められなかった…";
        testtubeLabelEl.className = 'testtube-label ng';
        hintEl.textContent = "しっぱい！" + result.why;
      }
    }, 900);
  }

  // にげる気体のエフェクト
  function spawnEscapePuffs(dir, method) {
    for (let i = 0; i < 6; i++) {
      const puff = document.createElement('div');
      puff.className = 'escape-puff esc-' + (dir === 'dissolve' ? 'dissolve' : dir);
      puff.style.setProperty('--dx', (Math.random() * 24 - 12) + 'px');
      puff.style.animationDelay = (i * 0.12) + 's';
      // 出発位置：口の位置（向きで変わる）
      if (dir === 'up') {
        // 口が上（通常向き）から上へにげる
        puff.style.top = '52px';
      } else if (dir === 'down') {
        // 口が下（逆さま）から下へにげる
        puff.style.bottom = '14px';
      } else {
        // 水そうの中でとけて消える
        puff.style.bottom = '6px';
      }
      testtubeArea.appendChild(puff);
      setTimeout(() => puff.remove(), 1600);
    }
  }

  function testCombustion() {
    if (!collectedGas) return;
    const data = GASES[collectedGas];
    const combustible = data ? data.combustible : "none";

    tubeFlameEl.classList.remove('burn', 'burn-big');
    tubeExtinguishEl.classList.remove('show');
    tubeExplosionEl.classList.remove('active');

    if (combustible === "hydrogen") {
      tubeFlameEl.classList.add('burn');
      setTimeout(() => {
        tubeFlameEl.classList.remove('burn');
        tubeExplosionEl.classList.add('active');
        testtubeEl.classList.add('broken');
        gasFillEl.classList.remove('filled');
        testtubeLabelEl.textContent = "ポン！と爆発した";
        hintEl.textContent = "ポンと音がして爆発した！水素はとても燃えやすい気体です。";
        collectedGas = null;
        tubeActions.style.display = 'none';
        tubeActionsPanel.style.display = 'none';
      }, 350);
    } else if (combustible === "oxygen") {
      tubeFlameEl.classList.add('burn');
      setTimeout(() => {
        tubeFlameEl.classList.remove('burn');
        tubeFlameEl.classList.add('burn-big');
        hintEl.textContent = "炎が大きく燃え上がった！酸素は燃焼を助ける気体です。";
      }, 400);
      setTimeout(() => { tubeFlameEl.classList.remove('burn-big'); }, 2400);
    } else if (combustible === "co2") {
      tubeFlameEl.classList.add('burn');
      setTimeout(() => {
        tubeFlameEl.classList.remove('burn');
        tubeExtinguishEl.classList.add('show');
        setTimeout(() => {
          hintEl.textContent = "炎が消えた！二酸化炭素は燃焼を消す気体です。";
        }, 500);
      }, 800);
    } else {
      tubeFlameEl.classList.add('burn');
      setTimeout(() => {
        tubeFlameEl.classList.remove('burn');
        hintEl.textContent = "炎は小さいまま。この気体は燃えません。";
      }, 1500);
    }
  }

  function testLimewater() {
    if (!collectedGas) return;
    limewaterFillEl.classList.add('show');

    if (collectedGas === "二酸化炭素") {
      setTimeout(() => {
        limewaterFillEl.classList.add('cloudy');
        testtubeLabelEl.textContent = "石灰水が白くにごった";
        hintEl.textContent = "石灰水が白くにごった！この気体は二酸化炭素です（CaCO₃が沈殿）。";
      }, 400);
    } else {
      testtubeLabelEl.textContent = "石灰水：変化なし";
      hintEl.textContent = "石灰水は変化しなかった。二酸化炭素ではないことが確認できた。";
    }
  }

  function resetTestTube() {
    collectedGas = null;
    gasFillEl.classList.remove('filled');
    limewaterFillEl.classList.remove('show', 'cloudy');
    tubeFlameEl.classList.remove('burn', 'burn-big');
    tubeExtinguishEl.classList.remove('show');
    tubeExplosionEl.classList.remove('active');
    testtubeEl.classList.remove('broken', 'shake');
    testtubeArea.classList.remove('has-gas', 'flipped', 'water-mode');
    testtubeArea.querySelectorAll('.escape-puff').forEach(p => p.remove());
    testtubeLabelEl.textContent = "気体なし";
    testtubeLabelEl.className = 'testtube-label';
    tubeActions.style.display = 'none';
    tubeActionsPanel.style.display = 'none';
  }

  function render() {
    resetTestTube();

    if (!currentLiquid) {
      liquidEl.classList.remove('filled', 'cloudy');
      liquidEl.style.background = "rgba(220, 235, 245, 0.12)";
      liquidEl.style.height = '0%';
      updateSolidsDisplay();
      crystalsDisplayEl.innerHTML = '';
      updateBubbles(false);
      paperEl.classList.remove('show');
      labelEl.textContent = "";
      phEl.textContent = ""; 
      recipeEl.textContent = "";
      gasProdEl.textContent = ""; 
      reactionEl.textContent = ""; 
      smellEl.textContent = "";
      setMethodsEnabled(false);
      hintEl.textContent = "まず液体をえらんでね。";
      return;
    }

    const property = calculateProperty();
    const reaction = findReaction();
    liquidEl.classList.add('filled');
    liquidEl.classList.remove('cloudy');
    liquidEl.style.height = liquidHeight + '%';

    labelEl.textContent = isLimewater() ? "石灰水（水＋水酸化カルシウム）" : currentLiquid;

    let recipe = [];
    if (selectedSolids.size > 0) recipe.push([...selectedSolids].join("・"));
    recipeEl.textContent = recipe.length > 0 ? recipe.join(" + ") : "(シンプル)";

    updateSolidsDisplay();

    const gasKey = getCurrentGasKey();

    if (reaction && reaction.formula) {
      reactionEl.textContent = reaction.formula;
      gasProdEl.textContent = reaction.gas ? "→ " + reaction.gas + " が発生" : "";
      updateBubbles(reaction.bubbles);
      setMethodsEnabled(!!gasKey);
    } else {
      reactionEl.textContent = "（この組み合わせの反応はまだ登録されていません）";
      gasProdEl.textContent = "";
      updateBubbles(false);
      setMethodsEnabled(!!gasKey);
    }

    let smellText = "";
    if (LIQUIDS[currentLiquid].smell) smellText += LIQUIDS[currentLiquid].smell + " ";
    if (reaction && reaction.smell) smellText += reaction.smell;
    smellEl.textContent = smellText;

    if (property === "acid") phEl.textContent = "酸性";
    else if (property === "base") phEl.textContent = "アルカリ性";
    else phEl.textContent = "中性";

    // 溶けている固体による水溶液の色（硫酸銅の青など）
    let solutionColor = "rgba(220, 235, 245, 0.12)";
    selectedSolids.forEach(s => {
      if (SOLIDS[s].solutionColor) solutionColor = SOLIDS[s].solutionColor;
    });

    if (!selectedIndicator) {
      liquidEl.style.background = solutionColor;
      paperEl.classList.remove('show');
      hintEl.textContent = gasKey ? "気体を試験管に集めるか、加熱して蒸発させてみよう。" : "指示薬で色を見てみよう。";
      return;
    }

    const ind = INDICATORS[selectedIndicator];
    if (ind.type === "paper") {
      liquidEl.style.background = solutionColor;
      // 上半分は元の紙の色、下半分（液に浸かる）は変色後の色
      paperTopEl.style.background = ind.paperBase;
      paperBottomEl.style.background = ind.paperBase; // まず元の色
      paperEl.classList.add('show');
      // 少し遅らせて、浸かった部分が変色するアニメーション
      setTimeout(() => {
        paperBottomEl.style.background = ind.colors[property];
      }, 300);
      hintEl.textContent = selectedIndicator + "を液にひたした → " + ind.desc[property];
    } else {
      liquidEl.style.background = ind.colors[property];
      paperEl.classList.remove('show');
      hintEl.textContent = selectedIndicator + " → " + ind.desc[property];
    }
  }

  document.getElementById('reset').onclick = () => {
    currentLiquid = null;
    selectedSolids.clear();
    selectedIndicator = null;
    beakerBroken = false;
    burnedSolids.clear();
    liquidHeight = 58;
    stopHeating();
    document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
    document.querySelectorAll('#liquids button, #indicators button').forEach(b => b.classList.remove('active'));
    liquidEl.classList.remove('filled', 'cloudy');
    liquidEl.style.background = "rgba(220, 235, 245, 0.12)";
    liquidEl.style.height = '0%';
    updateSolidsDisplay();
    crystalsDisplayEl.innerHTML = '';
    updateBubbles(false);
    beakerEl.classList.remove('broken');
    paperEl.classList.remove('show');
    resetTestTube();
    labelEl.textContent = "";
    phEl.textContent = ""; 
    recipeEl.textContent = "";
    gasProdEl.textContent = ""; 
    reactionEl.textContent = ""; 
    smellEl.textContent = "";
    setMethodsEnabled(false);
    hintEl.textContent = "まず液体をえらんでね。";
  };
</script>
</body>
</html>
