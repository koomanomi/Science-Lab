<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>力のしくみ実験室 — てこ・バネ・浮力サンドボックス</title>
<style>
  :root{
    --ink:#1a2238;        /* 深い藍 */
    --ink-soft:#3d4b6b;
    --paper:#f3efe6;      /* 製図用紙 */
    --paper-line:#d9d2c2;
    --beam:#c9923f;       /* 木のさお */
    --beam-dark:#a8762c;
    --steel:#5b6b8c;      /* 支点・金具 */
    --weight:#2f4858;     /* おもり */
    --force-down:#d8553a; /* 下向きの力(重力) */
    --force-up:#2f8f6b;   /* 上向きの力(支える力) */
    --spring:#7a5fb0;     /* バネ */
    --water:#4a8db5;      /* 水 */
    --accent:#e8b53f;     /* つりあいランプ */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--ink);
    color:var(--ink);
    line-height:1.6;
    overflow-x:hidden;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

  /* ---- ヘッダー ---- */
  header{padding:30px 16px 22px;text-align:center;color:var(--paper)}
  .eyebrow{
    font-size:13px;letter-spacing:.4em;color:var(--accent);
    font-weight:700;margin-bottom:10px;text-indent:.4em;
  }
  header h1{
    font-size:clamp(28px,6vw,46px);font-weight:800;letter-spacing:.02em;
    line-height:1.2;
  }
  header h1 .small{display:block;font-size:.5em;font-weight:600;color:var(--paper-line);letter-spacing:.1em;margin-top:8px}

  /* ---- タブ ---- */
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 6px}
  .tab{
    background:transparent;border:1.5px solid rgba(243,239,230,.35);
    color:var(--paper);padding:9px 18px;border-radius:999px;cursor:pointer;
    font-size:15px;font-weight:700;font-family:inherit;transition:.15s;
  }
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
  .tab.locked{opacity:.4;cursor:not-allowed}
  .tab.locked::after{content:" 🔒";font-size:12px}

  /* ---- メインボード ---- */
  .board-card{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);
    background-size:26px 26px;
    border-radius:18px;padding:10px;margin-top:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
  }
  .stage-wrap{position:relative;width:100%}
  svg.stage{display:block;width:100%;height:auto;touch-action:none;border-radius:12px}

  /* ---- バランスランプ ---- */
  .balance-pill{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:7px 16px;border-radius:999px;
    font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .balance-dot{width:11px;height:11px;border-radius:50%;background:var(--force-down)}
  .balance-pill.ok .balance-dot{background:var(--force-up);box-shadow:0 0 0 4px rgba(47,143,107,.3)}

  /* ---- 下段:操作パネル + 解説 ---- */
  .lower{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:820px){.lower{grid-template-columns:1fr}}
  .panel{
    background:var(--paper);border-radius:16px;padding:18px 18px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .panel h2{
    font-size:15px;letter-spacing:.14em;color:var(--steel);text-transform:uppercase;
    margin-bottom:14px;display:flex;align-items:center;gap:8px;
  }
  .panel h2 .bar{width:22px;height:3px;background:var(--accent);border-radius:2px}

  /* おもり一覧 */
  .weight-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--paper-line)}
  .weight-row:last-child{border-bottom:none}
  .chip{
    width:34px;height:34px;border-radius:8px;background:var(--weight);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;
  }
  .weight-row label{font-weight:700;font-size:14px;flex:none;width:54px}
  .weight-row input[type=range]{flex:1;accent-color:var(--steel)}
  .val{font-variant-numeric:tabular-nums;font-weight:800;width:70px;text-align:right;font-size:14px}

  .toolbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .toolbtn{
    flex:1;min-width:120px;border:1.5px solid var(--steel);background:#fff;color:var(--ink);
    padding:11px 8px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;
    font-family:inherit;transition:.12s;
  }
  .toolbtn:hover{background:var(--steel);color:#fff}
  .toolbtn.danger{border-color:var(--force-down);color:var(--force-down)}
  .toolbtn.danger:hover{background:var(--force-down);color:#fff}

  .field{margin:14px 0}
  .field label{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:5px}
  .field input[type=range]{width:100%;accent-color:var(--beam-dark)}

  /* 計算式パネル */
  #explain .formula{
    background:var(--ink);color:var(--paper);border-radius:12px;padding:14px 16px;
    font-variant-numeric:tabular-nums;font-size:15px;line-height:1.9;
  }
  #explain .formula .hl{color:var(--accent);font-weight:800}
  #explain .formula .side-l{color:#f0a58c}
  #explain .formula .side-r{color:#8fd6bd}
  #explain .note{font-size:13px;color:var(--ink-soft);margin-top:12px}
  .ledger{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
  .ledger th,.ledger td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--paper-line)}
  .ledger th{color:var(--steel);font-size:12px;letter-spacing:.05em}
  .ledger td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .tag-l{color:var(--force-down);font-weight:800}
  .tag-r{color:var(--force-up);font-weight:800}

  .hint{
    background:rgba(232,181,63,.16);border-left:4px solid var(--accent);
    border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px;color:var(--ink-soft);margin-top:14px;
  }
  .hint b{color:var(--ink)}
  footer{text-align:center;color:var(--paper-line);font-size:12px;margin-top:30px;opacity:.6}

  .weight-handle{cursor:grab}
  .weight-handle:active{cursor:grabbing}
</style>
</head>
<body>
<header>
  <div class="eyebrow">理 科 実 験 室</div>
  <h1>力のしくみ実験室
    <span class="small">てこ・バネ・浮力で「つりあい」を体感する</span>
  </h1>
  <nav class="tabs" role="tablist" aria-label="実験の種類">
    <button class="tab" role="tab" aria-selected="true" data-mode="lever">てこ</button>
    <button class="tab locked" role="tab" aria-selected="false" disabled>滑車（準備中）</button>
    <button class="tab locked" role="tab" aria-selected="false" disabled>バネ（準備中）</button>
    <button class="tab locked" role="tab" aria-selected="false" disabled>浮力（準備中）</button>
  </nav>
</header>

<div class="wrap">
  <!-- ====== ボード ====== -->
  <div class="board-card">
    <div class="stage-wrap">
      <div class="balance-pill" id="balancePill"><span class="balance-dot"></span><span id="balanceText">かたむき中</span></div>
      <svg class="stage" id="stage" viewBox="0 0 900 460" aria-label="てこの実験ボード"></svg>
    </div>
  </div>

  <!-- ====== 下段 ====== -->
  <div class="lower">
    <!-- 操作パネル -->
    <div class="panel">
      <h2><span class="bar"></span>そうさパネル</h2>

      <div class="field">
        <label>左うで・右うでの長さ <span class="val" id="armLabel">左60 / 右60 cm</span></label>
        <input type="range" id="armBalance" min="20" max="100" value="60" step="5">
        <div style="font-size:12px;color:var(--ink-soft);margin-top:3px">支点を左右にずらして、うでの長さを変えます</div>
      </div>

      <h2 style="margin-top:18px"><span class="bar"></span>おもり（ドラッグでさおに乗せる）</h2>
      <div id="weightList"></div>

      <div class="toolbtns">
        <button class="toolbtn" id="addWeight">＋ おもりを追加</button>
        <button class="toolbtn danger" id="resetBoard">リセット</button>
      </div>

      <div class="hint" id="hint">
        <b>使い方：</b>右の箱から「おもり」をつかんで、さおの上にドラッグ。支点からの距離を変えると、つりあいが変わります。
      </div>
    </div>

    <!-- 解説パネル -->
    <div class="panel" id="explain">
      <h2><span class="bar"></span>力のけいさん</h2>
      <div class="formula" id="formula"></div>
      <table class="ledger" id="ledger">
        <thead><tr><th>おもり</th><th>重さ</th><th>支点からの距離</th><th>モーメント</th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="note" id="fulcrumNote"></p>
    </div>
  </div>

  <footer>力のしくみ実験室 — プロトタイプ v0.1（てこ）</footer>
</div>

<script>
const SVG_NS="http://www.w3.org/2000/svg";
const stage=document.getElementById("stage");
const VBW=900, VBH=460;

// ---- 座標系の基準 ----
const beamY=210;          // さおの高さ(画面y)
const beamLeftX=120, beamRightX=780; // さおの両端x
const beamCenterX=(beamLeftX+beamRightX)/2; // =450 さおの中心
const PX_PER_CM=4.2;      // 1cm = 何px (見た目の縮尺)

// ---- 状態 ----
let armBalance=60;        // 左右それぞれのうで長(cm) ※支点位置で表現
let weights=[];           // {id, mass, distCm, side, x}  side:'L'/'R', distCm:支点からの距離
let nextId=1;
let dragging=null;

// 初期おもり
function seed(){
  weights=[
    {id:nextId++, mass:100, distCm:40, side:'L'},
    {id:nextId++, mass:200, distCm:20, side:'R'},
  ];
}
seed();

// 支点のx(画面) … armBalanceは「左うでの長さ(cm)」とし、右も同値が基本。
// ここではスライダーで左うで長を決め、支点位置=中心からの差で表現。
let leftArmCm=60, rightArmCm=60;
function fulcrumX(){
  // 支点を動かす：左うでが長いほど支点は右へ寄る、という直感より
  // ここは「さおは固定長、支点を左右に動かす」モデル。
  // armBalance(20-100)を左うで長として、右うで長=(120-armBalance)に連動させる。
  return beamLeftX + leftArmCm*PX_PER_CM;
}

// うで長スライダー：1本で左右を相補的に動かす(合計120cm固定のさお)
function setArm(v){
  leftArmCm=v;
  rightArmCm=120-v;
  document.getElementById("armLabel").textContent=`左${leftArmCm} / 右${rightArmCm} cm`;
}

// ====== 描画 ======
function el(tag,attrs){const e=document.createElementNS(SVG_NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function clear(){while(stage.firstChild)stage.removeChild(stage.firstChild);}

function moment(w){return w.mass*w.distCm;} // g·cm

function totals(){
  let L=0,R=0;
  weights.forEach(w=>{ if(w.side==='L')L+=moment(w); else R+=moment(w); });
  return {L,R};
}

function weightScreenX(w){
  const fx=fulcrumX();
  return w.side==='L' ? fx - w.distCm*PX_PER_CM : fx + w.distCm*PX_PER_CM;
}

function draw(){
  clear();
  const {L,R}=totals();
  const diff=R-L;                       // 正なら右が下がる
  const maxM=Math.max(L,R,1);
  // かたむき角度(見た目用): 差の割合 → 最大±9°
  let angle = Math.max(-9,Math.min(9, (diff/Math.max(maxM,400))*9 ));
  const balanced = Math.abs(diff)<1;
  if(balanced) angle=0;

  const fx=fulcrumX();
  const rad=angle*Math.PI/180;

  // --- 支柱(三角の支点) ---
  stage.appendChild(el("polygon",{points:`${fx},${beamY} ${fx-26},${beamY+70} ${fx+26},${beamY+70}`,fill:"var(--steel)"}));
  stage.appendChild(el("rect",{x:fx-46,y:beamY+70,width:92,height:14,rx:4,fill:"var(--ink)"}));
  // 支点ピン
  stage.appendChild(el("circle",{cx:fx,cy:beamY,r:7,fill:"var(--ink)"}));

  // --- 回転するさおグループ ---
  const g=el("g",{transform:`rotate(${angle} ${fx} ${beamY})`});
  // さお本体
  g.appendChild(el("rect",{x:beamLeftX,y:beamY-9,width:beamRightX-beamLeftX,height:18,rx:7,fill:"var(--beam)",stroke:"var(--beam-dark)","stroke-width":2}));
  // 目盛り(10cmごと)
  for(let cm=-Math.round((fx-beamLeftX)/PX_PER_CM);cm<=Math.round((beamRightX-fx)/PX_PER_CM);cm+=10){
    const x=fx+cm*PX_PER_CM;
    if(x<beamLeftX||x>beamRightX)continue;
    const major=(cm%20===0);
    g.appendChild(el("line",{x1:x,y1:beamY-9,x2:x,y2:beamY-(major?17:13),stroke:"var(--beam-dark)","stroke-width":major?2:1}));
  }
  stage.appendChild(g);

  // --- おもり(回転後の位置に配置。ぶら下がるので鉛直に垂らす) ---
  weights.forEach(w=>{
    const baseX=weightScreenX(w);
    // さお上の取り付け点を回転で移動
    const dx=baseX-fx;
    const ax=fx+dx*Math.cos(rad);
    const ay=beamY+dx*Math.sin(rad);

    const gw=el("g",{class:"weight-handle"});
    gw.dataset.id=w.id;
    // ひも(取り付け点から鉛直下)
    const hangTop=ay+9;
    const boxH=26+w.mass*0.045;
    const boxW=34+w.mass*0.02;
    const boxTop=hangTop+34;
    gw.appendChild(el("line",{x1:ax,y1:hangTop,x2:ax,y2:boxTop,stroke:"var(--ink)","stroke-width":2}));
    // おもり箱
    gw.appendChild(el("rect",{x:ax-boxW/2,y:boxTop,width:boxW,height:boxH,rx:5,fill:"var(--weight)"}));
    gw.appendChild(el("text",{x:ax,y:boxTop+boxH/2+5,"text-anchor":"middle",fill:"#fff","font-size":13,"font-weight":800},));
    gw.lastChild.textContent=w.mass+"g";
    // 重力の矢印(下向き)
    const arrowLen=24+w.mass*0.04;
    arrow(gw, ax, boxTop+boxH+4, ax, boxTop+boxH+4+arrowLen, "var(--force-down)");
    gw.appendChild(el("text",{x:ax+8,y:boxTop+boxH+4+arrowLen-4,fill:"var(--force-down)","font-size":11,"font-weight":700},));
    gw.lastChild.textContent=w.mass+"gの重力";
    // 距離ラベル
    gw.appendChild(el("text",{x:ax,y:boxTop-6,"text-anchor":"middle",fill:"var(--ink-soft)","font-size":12,"font-weight":700},));
    gw.lastChild.textContent=w.distCm+"cm";
    stage.appendChild(gw);
  });

  // --- 支点の支える力(上向き) ---
  const total=weights.reduce((s,w)=>s+w.mass,0);
  arrow(stage, fx, beamY-2, fx, beamY-2-(28+total*0.03), "var(--force-up)");
  const fl=el("text",{x:fx+10,y:beamY-30,fill:"var(--force-up)","font-size":12,"font-weight":800});
  fl.textContent=`支点が支える力 ${total}g`;
  stage.appendChild(fl);

  // --- 取り付けターゲットの目印(ドラッグ中) ---
  if(dragging){
    stage.appendChild(el("line",{x1:beamLeftX,y1:beamY-30,x2:beamRightX,y2:beamY-30,stroke:"var(--accent)","stroke-width":2,"stroke-dasharray":"5 5",opacity:.7}));
  }

  updateBalanceUI(L,R,balanced);
  updateExplain(L,R,balanced);
  attachDrag();
}

function arrow(parent,x1,y1,x2,y2,color){
  parent.appendChild(el("line",{x1,y1,x2,y2,stroke:color,"stroke-width":3}));
  const ang=Math.atan2(y2-y1,x2-x1);
  const h=7;
  const p=`${x2},${y2} ${x2-h*Math.cos(ang-0.5)},${y2-h*Math.sin(ang-0.5)} ${x2-h*Math.cos(ang+0.5)},${y2-h*Math.sin(ang+0.5)}`;
  parent.appendChild(el("polygon",{points:p,fill:color}));
}

// ====== バランスUI ======
function updateBalanceUI(L,R,balanced){
  const pill=document.getElementById("balancePill");
  const t=document.getElementById("balanceText");
  if(balanced){pill.classList.add("ok");t.textContent="つりあった！";}
  else{pill.classList.remove("ok");t.textContent=(R>L?"右が下がる":"左が下がる");}
}

// ====== 計算式の解説 ======
function updateExplain(L,R,balanced){
  const f=document.getElementById("formula");
  f.innerHTML=
    `<div>てこのつりあい　＝　<b>左まわり</b>と<b>右まわり</b>のモーメントが等しいとき</div>`+
    `<div style="margin-top:8px">左：<span class="side-l">${L.toLocaleString()}</span> g·cm　`+
    `${balanced?'＝':(L>R?'＞':'＜')}　`+
    `右：<span class="side-r">${R.toLocaleString()}</span> g·cm</div>`+
    (balanced
      ? `<div style="margin-top:8px"><span class="hl">つりあい成立！</span></div>`
      : `<div style="margin-top:8px">差：<span class="hl">${Math.abs(R-L).toLocaleString()}</span> g·cm ぶん、${R>L?'右':'左'}が下がる</div>`);

  // 台帳
  const tb=document.querySelector("#ledger tbody");
  tb.innerHTML="";
  weights.forEach(w=>{
    const tr=document.createElement("tr");
    tr.innerHTML=
      `<td><span class="${w.side==='L'?'tag-l':'tag-r'}">${w.side==='L'?'左':'右'}</span></td>`+
      `<td class="num">${w.mass} g</td>`+
      `<td class="num">${w.distCm} cm</td>`+
      `<td class="num">${moment(w).toLocaleString()}</td>`;
    tb.appendChild(tr);
  });

  document.getElementById("fulcrumNote").innerHTML=
    `モーメント＝<b>重さ×支点からの距離</b>。支点が支える力＝のせたおもりの合計（${weights.reduce((s,w)=>s+w.mass,0)} g）。`;
}

// ====== ドラッグ操作 ======
function clientToSVG(evt){
  const pt=stage.createSVGPoint();
  const src=evt.touches?evt.touches[0]:evt;
  pt.x=src.clientX;pt.y=src.clientY;
  return pt.matrixTransform(stage.getScreenCTM().inverse());
}

function attachDrag(){
  stage.querySelectorAll(".weight-handle").forEach(g=>{
    g.addEventListener("pointerdown",startDrag);
  });
}
function startDrag(e){
  e.preventDefault();
  const id=+e.currentTarget.dataset.id;
  dragging=weights.find(w=>w.id===id);
  document.getElementById("hint").innerHTML="<b>移動中：</b>左右にドラッグして支点からの距離を変えてね。さおの中心が支点です。";
  window.addEventListener("pointermove",onDrag);
  window.addEventListener("pointerup",endDrag);
  draw();
}
function onDrag(e){
  if(!dragging)return;
  const p=clientToSVG(e);
  const fx=fulcrumX();
  let dx=p.x-fx;
  // 左右判定
  dragging.side = dx<0 ? 'L':'R';
  let cm=Math.round(Math.abs(dx)/PX_PER_CM/5)*5; // 5cm刻み
  // うで長を超えない
  const maxCm = dragging.side==='L'?leftArmCm:rightArmCm;
  cm=Math.max(5,Math.min(maxCm,cm));
  dragging.distCm=cm;
  draw();
}
function endDrag(){
  dragging=null;
  window.removeEventListener("pointermove",onDrag);
  window.removeEventListener("pointerup",endDrag);
  draw();
}

// ====== おもり一覧(重さ調整) ======
function renderWeightList(){
  const box=document.getElementById("weightList");
  box.innerHTML="";
  weights.forEach((w,i)=>{
    const row=document.createElement("div");
    row.className="weight-row";
    row.innerHTML=
      `<div class="chip">${w.side}</div>`+
      `<label>${i+1}つ目</label>`+
      `<input type="range" min="20" max="500" step="10" value="${w.mass}" data-id="${w.id}">`+
      `<span class="val">${w.mass} g</span>`;
    const range=row.querySelector("input");
    const val=row.querySelector(".val");
    range.addEventListener("input",()=>{
      w.mass=+range.value;val.textContent=w.mass+" g";draw();
    });
    box.appendChild(row);
  });
}

// ====== コントロール ======
document.getElementById("armBalance").addEventListener("input",e=>{
  setArm(+e.target.value);
  // うで長を超えるおもりはクランプ
  weights.forEach(w=>{
    const maxCm=w.side==='L'?leftArmCm:rightArmCm;
    if(w.distCm>maxCm)w.distCm=maxCm;
  });
  draw();
});
document.getElementById("addWeight").addEventListener("click",()=>{
  if(weights.length>=6){return;}
  const side = totals().L<=totals().R?'L':'R';
  weights.push({id:nextId++,mass:100,distCm:30,side});
  renderWeightList();draw();
});
document.getElementById("resetBoard").addEventListener("click",()=>{
  seed();setArm(60);
  document.getElementById("armBalance").value=60;
  renderWeightList();draw();
  document.getElementById("hint").innerHTML="<b>使い方：</b>おもりをつかんで、さおの上をドラッグ。支点からの距離でつりあいが変わります。";
});

// ====== 起動 ======
setArm(60);
renderWeightList();
draw();
</script>
</body>
</html>
